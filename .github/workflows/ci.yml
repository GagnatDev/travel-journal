name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.scaleway/**'
      - '.github/workflows/put-bucket-cors.yml'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '.scaleway/**'
      - '.github/workflows/put-bucket-cors.yml'

jobs:
  lint:
    name: Lint & Type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @travel-journal/shared build
      - run: pnpm lint

  unit:
    name: Unit & Component Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @travel-journal/shared build
      - run: pnpm test

  build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - run: docker build .

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [unit]
    services:
      mongodb:
        # `mongo:8` is 8.3.13, which exits when uname is 7.0.0. GitHub-hosted
        # ubuntu-24.04 reports 7.0.0-1017-azure for an upstream 7.0.14 kernel
        # (SERVER-121912 / SERVER-131779). 8.2.12 does not include that guard
        # and runs on the fixed kernel. Unpin once 8.0.35 or 8.3.14 is published.
        image: mongo:8.2.12
        ports:
          - 27019:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'quit(db.runCommand({ ping: 1 }).ok ? 0 : 1)'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      minio:
        image: pgsty/minio
        command: server /data --console-address ":9001"
        ports:
          - 9100:9000
          - 9101:9001
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @travel-journal/shared build
      - run: pnpm --filter @travel-journal/server build
      - run: pnpm --filter @travel-journal/client build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e:ci
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
      - name: Upload Playwright test-results (traces, videos, screenshots)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: test-results
          retention-days: 7
