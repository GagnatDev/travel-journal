services:
  mongodb:
    # Pin a specific 8.3 patch. 8.3.16+ reads Ubuntu's kernel signature, so
    # GitHub-hosted runners whose uname is 7.0.0 can start (SERVER-131779).
    # 8.3.13 cannot. Do not float `mongo:8` and do not move to MongoDB 9.
    # A volume written by 8.3 cannot be opened by 8.2.
    image: mongo:8.3.17
    ports:
      - "27019:27017"
    volumes:
      - mongo-data:/data/db

  minio:
    image: pgsty/minio
    command: server /data --console-address ":9001"
    ports:
      - "9100:9000"
      - "9101:9001"
    volumes:
      - minio-data:/data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin

  createbuckets:
    image: pgsty/mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
        sleep 3 &&
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/travel-journal
      "

volumes:
  mongo-data:
  minio-data:
